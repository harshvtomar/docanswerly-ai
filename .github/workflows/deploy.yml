name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      RAG_EVALUATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s training -p 'test_*.py'
      - name: Validate synthetic fine-tuning pilot (no model training)
        run: |
          python3 training/prepare_data.py --output training/data
          python3 training/validate_data.py --data training/data
          python3 training/train_lora.py --data training/data --check
      - run: npm test
      - run: npm run test:stress
      - run: npm run test:pdf
      - run: npm run test:retrieval
      - run: npm run test:hybrid
      - run: npm run build
      - run: npm run build:evaluation
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
            docs/evaluation.json
            docs/retrieval-evaluation.json
            docs/hybrid-evaluation.json
            docs/rag-evaluation.json
            docs/stress-evaluation.json
          retention-days: 14
      - run: rm -f dist/evaluation.html dist/assets/evaluation-*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
