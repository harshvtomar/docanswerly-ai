name: 500K novel word grounding-validator diagnostic
on:
  push:
    branches: [main]
    paths:
      - "scripts/novel-words-500k.ts"
      - "src/lib/answers.ts"
      - "src/lib/identifier-grounding.ts"
      - "src/lib/identifier-grounding.test.ts"
      - "src/lib/evidence-sufficiency.ts"
      - ".github/workflows/novel-words-500k.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validator-novel-words:
    name: 500000 unique novel English-Hindi word controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test 500000 new word forms through real validator
        run: node --import tsx scripts/novel-words-500k.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novel-words-500k-validator
          path: docs/novel-words-500k-validator.json
          retention-days: 30
