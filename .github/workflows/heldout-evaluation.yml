name: Held-out genuine Qwen3 bilingual evaluation
on:
  push:
    branches: [main]
    paths:
      - "evaluation/heldout-cases.json"
      - "evaluation/browser.ts"
      - "e2e/heldout-evaluation.spec.ts"
      - "playwright.config.ts"
      - ".github/workflows/heldout-evaluation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-llm-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      HELDOUT_EVALUATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:evaluation
      - run: npx playwright install --with-deps chromium
      - name: Run 28 genuine Qwen3 cases and preserve raw answers
        run: npx playwright test e2e/heldout-evaluation.spec.ts --project=heldout-evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-real-qwen3-review
          path: |
            docs/heldout-qwen3-evaluation.json
            docs/heldout-qwen3-review.csv
            playwright-report/
            test-results/
          retention-days: 30
