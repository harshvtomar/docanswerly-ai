name: Fresh post-fix genuine Qwen3 bilingual evaluation
on:
  push:
    branches: [main]
    paths:
      - "src/lib/bilingual-evidence.ts"
      - "src/lib/bilingual-evidence.test.ts"
      - "src/lib/bilingual-integrity.ts"
      - "src/lib/bilingual-integrity.test.ts"
      - "src/lib/claim-support.ts"
      - "src/lib/claim-support.test.ts"
      - "src/lib/hindi-facts.ts"
      - "src/lib/answers.ts"
      - "src/lib/identifier-grounding.ts"
      - "src/lib/identifier-grounding.test.ts"
      - "src/lib/evidence-availability.ts"
      - "src/lib/evidence-sufficiency.ts"
      - "evaluation/heldout-v2-cases.json"
      - "evaluation/browser.ts"
      - "e2e/heldout-postfix-evaluation.spec.ts"
      - "playwright.config.ts"
      - ".github/workflows/postfix-evaluation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-qwen3-postfix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      POSTFIX_EVALUATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:evaluation
      - run: npx playwright install --with-deps chromium
      - name: Run independent-from-training 24-case genuine model suite
        run: npx playwright test e2e/heldout-postfix-evaluation.spec.ts --project=heldout-postfix-evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postfix-real-qwen3-review
          path: |
            docs/postfix-qwen3-evaluation.json
            docs/postfix-qwen3-review.csv
            playwright-report/
            test-results/
          retention-days: 30
